<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ ChargeNear — Logic Tests</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 24px; max-width: 640px; margin: 0 auto; background: #f8fafc; }
    h1   { color: #0f766e; margin-bottom: 4px; }
    p.subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 24px; }
    .test { padding: 10px 14px; margin: 6px 0; border-radius: 8px; font-size: 0.9rem; font-family: monospace; }
    .pass { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .fail { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
    #summary { margin-top: 20px; font-weight: 700; font-size: 1.1rem; padding: 14px 16px; border-radius: 8px; }
    .all-pass { background: #dcfce7; color: #15803d; }
    .some-fail{ background: #fee2e2; color: #dc2626; }
  </style>
</head>
<body>
  <h1>⚡ ChargeNear — Logic Tests</h1>
  <p class="subtitle">In-browser unit tests for logic.js pure functions. All results should be green.</p>
  <div id="results"></div>
  <div id="summary"></div>

  <!-- Load only logic.js (no DOM required) -->
  <script src="../js/logic.js"></script>
  <script>
    var tests = [];

    function assert(description, condition) {
      tests.push({ description: description, passed: !!condition });
    }

    // ── haversineKm ──────────────────────────────────────────────────────────
    assert(
      "haversineKm: identical points → ~0 km",
      haversineKm(18.5, 73.8, 18.5, 73.8) < 0.001
    );
    var d = haversineKm(18.5074, 73.8077, 18.5800, 73.9800); // Kothrud → Wagholi
    assert(
      "haversineKm: Kothrud→Wagholi is 10–25 km (got " + d.toFixed(2) + " km)",
      d > 10 && d < 25
    );

    // ── hasOverlap ───────────────────────────────────────────────────────────
    assert(
      "hasOverlap: back-to-back 10–12 and 12–14 → NOT overlapping",
      !hasOverlap(10, 2, 12, 2)
    );
    assert(
      "hasOverlap: back-to-back 12–14 and 10–12 → NOT overlapping",
      !hasOverlap(12, 2, 10, 2)
    );
    assert(
      "hasOverlap: 10–12 and 11–13 → DO overlap",
      hasOverlap(10, 2, 11, 2)
    );
    assert(
      "hasOverlap: identical 10–12 and 10–12 → DO overlap",
      hasOverlap(10, 2, 10, 2)
    );
    assert(
      "hasOverlap: 10–14 contains 11–12 → DO overlap",
      hasOverlap(10, 4, 11, 1)
    );

    // ── isWithinHours ────────────────────────────────────────────────────────
    assert(
      "isWithinHours: 10–12 within 08:00–20:00 → valid",
      isWithinHours(10, 2, "08:00", "20:00")
    );
    assert(
      "isWithinHours: 19–21 ending after 20:00 → rejected",
      !isWithinHours(19, 2, "08:00", "20:00")
    );
    assert(
      "isWithinHours: 6–8 starting before 08:00 → rejected",
      !isWithinHours(6, 2, "08:00", "20:00")
    );
    assert(
      "isWithinHours: 8–20 exactly fills window → valid",
      isWithinHours(8, 12, "08:00", "20:00")
    );

    // ── calcEarnings ─────────────────────────────────────────────────────────
    // 10h available, 25% utilization, ₹80/hr
    // monthlyGross = 10 × 0.25 × 80 × 30 = 6000
    // fee          = 6000 × 0.10 = 600
    // net          = 6000 × 0.90 = 5400
    var e = calcEarnings(10, 0.25, 80);
    assert("calcEarnings(10h, 25%, ₹80) → gross ₹6,000 (got ₹" + e.gross + ")", e.gross === 6000);
    assert("calcEarnings(10h, 25%, ₹80) → fee  ₹600  (got ₹" + e.fee  + ")", e.fee  === 600);
    assert("calcEarnings(10h, 25%, ₹80) → net  ₹5,400 (got ₹" + e.net  + ")", e.net  === 5400);

    // Second test case: 12h, 40%, ₹100
    // gross = 12 × 0.40 × 100 × 30 = 14400, net = 12960
    var e2 = calcEarnings(12, 0.40, 100);
    assert("calcEarnings(12h, 40%, ₹100) → gross ₹14,400 (got ₹" + e2.gross + ")", e2.gross === 14400);
    assert("calcEarnings(12h, 40%, ₹100) → net ₹12,960 (got ₹" + e2.net + ")",   e2.net   === 12960);

    // ── validateCharger ──────────────────────────────────────────────────────
    var good = { name: "My Charger", area: "Baner, Pune", powerKw: "7.4",
                 pricePerHour: "80", availableFrom: "08:00", availableTo: "20:00",
                 hostName: "Ravi M." };

    assert("validateCharger: valid data → valid",
      validateCharger(good).valid
    );
    assert("validateCharger: empty name → invalid",
      !validateCharger(Object.assign({}, good, { name: "" })).valid
    );
    assert("validateCharger: name too short (< 3 chars) → invalid",
      !validateCharger(Object.assign({}, good, { name: "AB" })).valid
    );
    assert("validateCharger: price 0 → invalid",
      !validateCharger(Object.assign({}, good, { pricePerHour: "0" })).valid
    );
    assert("validateCharger: price 9 (below min ₹10) → invalid",
      !validateCharger(Object.assign({}, good, { pricePerHour: "9" })).valid
    );
    assert("validateCharger: availableTo <= availableFrom → invalid",
      !validateCharger(Object.assign({}, good, { availableFrom: "20:00", availableTo: "08:00" })).valid
    );
    assert("validateCharger: availableTo == availableFrom → invalid",
      !validateCharger(Object.assign({}, good, { availableFrom: "10:00", availableTo: "10:00" })).valid
    );
    assert("validateCharger: no area selected → invalid",
      !validateCharger(Object.assign({}, good, { area: "" })).valid
    );
    assert("validateCharger: host name too short → invalid",
      !validateCharger(Object.assign({}, good, { hostName: "A" })).valid
    );

    // ── Render results ───────────────────────────────────────────────────────
    var container = document.getElementById("results");
    var passed    = 0;

    tests.forEach(function(t) {
      var div = document.createElement("div");
      div.className   = "test " + (t.passed ? "pass" : "fail");
      div.textContent = (t.passed ? "✅ " : "❌ ") + t.description;
      container.appendChild(div);
      if (t.passed) passed++;
    });

    var summary = document.getElementById("summary");
    summary.textContent = passed + " / " + tests.length + " tests passed";
    summary.className   = passed === tests.length ? "all-pass" : "some-fail";
  </script>
</body>
</html>
